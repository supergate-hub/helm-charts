name: Release charts
on:
  push:
    branches: [main]
    paths:
      - 'charts/**'
      - 'cr.yaml'
      - '.github/workflows/release.yaml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-charts
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.19.0
      - name: Add dependency repositories
        run: |
          set -eu
          for dir in charts/*/; do
            helm dependency list "$dir" 2>/dev/null | tail -n +2 | awk 'NF>=3 && $3 ~ /^https?:/ {print $1, $3}' | while read -r name url; do
              helm repo add "$name" "$url" >/dev/null 2>&1 || true
            done
          done
      - name: Package and release changed charts
        uses: helm/chart-releaser-action@cae68fefc6b5f367a0275617c9f83181ba54714f # v1.7.0
        with:
          charts_dir: charts
          config: cr.yaml
          skip_existing: true
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Mirror the released charts to GHCR
        # Same artifact, second address: the Pages index stays the source consumers use today,
        # and oci://ghcr.io/supergate-hub/charts serves the ones that speak OCI. chart-releaser
        # leaves exactly the charts it published in .cr-release-packages, so the two never drift.
        # helm push is a no-op for a tag that already exists with the same digest.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          set -eu
          packages=$(find .cr-release-packages -name '*.tgz' 2>/dev/null | sort)
          if [ -z "$packages" ]; then
            echo "no chart was released; nothing to mirror"
            exit 0
          fi
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io --username "$ACTOR" --password-stdin
          for package in $packages; do
            helm push "$package" oci://ghcr.io/supergate-hub/charts
          done
          helm registry logout ghcr.io

# yamllint configuration used by chart-testing (ct lint --lint-conf).
# Vendored upstream charts are kept byte-for-byte, so stylistic rules are disabled;
# only real YAML problems (syntax errors, duplicate keys) fail the lint.
extends: default
rules:
  braces: disable
  brackets: disable
  colons: disable
  commas: disable
  comments: disable
  comments-indentation: disable
  document-end: disable
  document-start: disable
  empty-lines: disable
  empty-values: disable
  hyphens: disable
  indentation: disable
  key-duplicates: enable
  key-ordering: disable
  line-length: disable
  new-line-at-end-of-file: disable
  new-lines: disable
  octal-values: disable
  quoted-strings: disable
  trailing-spaces: disable
  truthy: disable

name: Gateway image
on:
  pull_request:
    paths:
      - 'images/gateway/**'
      - '.github/workflows/image-gateway.yaml'
  push:
    branches: [main]
    paths:
      - 'images/gateway/**'
      - '.github/workflows/image-gateway.yaml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: image-gateway-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/sst-traefik
  TRIVY: aquasec/trivy:0.72.0@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f
  BUILDKIT: moby/buildkit:v0.33.0@sha256:6c2fa84a6b61ccd72899dde4239f8d5717f05f9a8ca6f3cad185fb1a95a94de3
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read pinned Traefik version
        id: pins
        run: |
          set -eu
          version=$(sed -n 's/.*org.opencontainers.image.version="\([0-9][0-9.]*\)".*/\1/p' images/gateway/Dockerfile)
          upstream=$(sed -n 's/^FROM \(docker.io\/library\/traefik@sha256:[a-f0-9]\{64\}\) AS upstream$/\1/p' images/gateway/Dockerfile)
          test -n "$version" && test -n "$upstream"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "upstream=$upstream" >> "$GITHUB_OUTPUT"
      - name: Build OCI archive with provenance
        id: build
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          set -eu
          mkdir -p "${RUNNER_TEMP}/out"
          docker buildx create --name sst-gateway --use --driver docker-container --driver-opt "image=${BUILDKIT}"
          docker buildx build --platform linux/amd64 --provenance=mode=max \
            --build-arg "SOURCE_REVISION=${SOURCE_REVISION}" \
            --tag "sst-traefik:${SOURCE_REVISION}" \
            --metadata-file "${RUNNER_TEMP}/out/build-metadata.json" \
            --output "type=oci,dest=${RUNNER_TEMP}/out/image.oci.tar" images/gateway
          digest=$(python3 -c "import json;print(json.load(open('${RUNNER_TEMP}/out/build-metadata.json'))['containerimage.digest'])")
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "Built ${digest}"
          (cd "${RUNNER_TEMP}/out" && sha256sum image.oci.tar > image.oci.tar.sha256)
      - name: Unpack the archive fail-closed for the scanner
        run: |
          set -eu
          python3 -m unittest discover -s tests -t . -q
          python3 scripts/prepare_oci_scan.py "${RUNNER_TEMP}/out/image.oci.tar" "${RUNNER_TEMP}/out/image.oci.tar.sha256" "${RUNNER_TEMP}/oci-scan"
      - name: Gate the exact archive (High/Critical fail)
        run: |
          set -eu
          mkdir -m 700 "${RUNNER_TEMP}/trivy-cache"
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" --tmpfs /tmp --memory 2g --cpus 2 \
            --mount "type=bind,src=${RUNNER_TEMP}/trivy-cache,dst=/cache" \
            --mount "type=bind,src=${RUNNER_TEMP}/oci-scan,dst=/oci,readonly" \
            --mount "type=bind,src=${RUNNER_TEMP}/out,dst=/out" \
            "${TRIVY}" image --input /oci --cache-dir /cache --platform linux/amd64 \
            --scanners vuln --ignorefile /dev/null --severity HIGH,CRITICAL --exit-code 1 --timeout 10m \
            --format json --output /out/trivy-report.json
      - name: Compare with the official image (informational)
        env:
          UPSTREAM: ${{ steps.pins.outputs.upstream }}
          VERSION: ${{ steps.pins.outputs.version }}
        run: |
          set -eu
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" --tmpfs /tmp --memory 2g --cpus 2 \
            --mount "type=bind,src=${RUNNER_TEMP}/trivy-cache,dst=/cache" \
            --mount "type=bind,src=${RUNNER_TEMP}/out,dst=/out" \
            "${TRIVY}" image --cache-dir /cache --platform linux/amd64 --scanners vuln --ignorefile /dev/null \
            --severity HIGH,CRITICAL --exit-code 0 --timeout 10m --format json --output /out/official-report.json "${UPSTREAM}"
          python3 - "${RUNNER_TEMP}/out/official-report.json" "${VERSION}" "${UPSTREAM}" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          report, version, upstream = json.load(open(sys.argv[1])), sys.argv[2], sys.argv[3]
          findings = [v for r in report.get("Results", []) for v in (r.get("Vulnerabilities") or [])]
          crit = sum(1 for v in findings if v["Severity"] == "CRITICAL"); high = len(findings) - crit
          print(f"## Official image comparison\n\n`{upstream}` (Traefik {version}): **{crit} Critical, {high} High**.\n")
          print("The official image passes the gate: open a PR to switch consumers to its digest and retire this repackaging." if not findings
                else "The official image still fails the gate; keep the repackaged image.")
          for v in sorted({(v["PkgName"], v["VulnerabilityID"], v["Severity"]) for v in findings}):
              print(f"- {v[0]} {v[1]} ({v[2]})")
          PY
      # Publishing order: push under an immutable candidate tag only, gate the pushed digest with a
      # fresh remote scan, then attach the version tags by digest. The image is never rebuilt after
      # the scan, and version tags never point at an unscanned digest. The OCI index digest of the
      # local archive differs from the registry push because provenance attestations carry build
      # timestamps, so the archive digest is not compared with the pushed one.
      - name: Push candidate to GHCR
        if: ${{ github.event_name != 'pull_request' }}
        id: push
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          set -eu
          printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          docker buildx build --platform linux/amd64 --provenance=mode=max \
            --build-arg "SOURCE_REVISION=${SOURCE_REVISION}" \
            --tag "${IMAGE}:sha-${SOURCE_REVISION}" \
            --metadata-file "${RUNNER_TEMP}/out/push-metadata.json" \
            --output type=registry images/gateway
          pushed=$(python3 -c "import json;print(json.load(open('${RUNNER_TEMP}/out/push-metadata.json'))['containerimage.digest'])")
          echo "digest=${pushed}" >> "$GITHUB_OUTPUT"
      - name: Gate the pushed digest (High/Critical fail)
        if: ${{ github.event_name != 'pull_request' }}
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -eu
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" --tmpfs /tmp --memory 2g --cpus 2 \
            --mount "type=bind,src=${RUNNER_TEMP}/trivy-cache,dst=/cache" \
            "${TRIVY}" image --cache-dir /cache --platform linux/amd64 --scanners vuln --ignorefile /dev/null \
            --severity HIGH,CRITICAL --exit-code 1 --timeout 10m "${IMAGE}@${DIGEST}"
      - name: Attach version tags and record the digest
        if: ${{ github.event_name != 'pull_request' }}
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          VERSION: ${{ steps.pins.outputs.version }}
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          set -eu
          short=${SOURCE_REVISION:0:12}
          docker buildx imagetools create --tag "${IMAGE}:${VERSION}" --tag "${IMAGE}:${VERSION}-${short}" "${IMAGE}@${DIGEST}"
          {
            echo "## Published"
            echo
            echo "\`${IMAGE}@${DIGEST}\` (Traefik ${VERSION}, source ${GITHUB_SHA}); tags \`${VERSION}\`, \`${VERSION}-${short}\`, \`sha-${SOURCE_REVISION}\`"
            echo
            echo "Reference this digest from infra-ops gateway values. Harbor replication from GHCR keeps node pulls internal."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Clean disposable builder
        if: always()
        run: docker buildx rm sst-gateway || true

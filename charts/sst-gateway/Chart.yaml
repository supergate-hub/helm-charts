apiVersion: v2
name: sst-gateway
description: Supergate management web gateway. Wraps the upstream Traefik chart with the isolated namespace, Gateway API objects, RBAC, network policies, certificate mirroring and canary that the platform needs.
type: application
version: 1.0.0
appVersion: v3.7.13
kubeVersion: ">=1.29.0-0"
home: https://github.com/supergate-hub/helm-charts
sources:
  - https://github.com/supergate-hub/helm-charts/tree/main/charts/sst-gateway
  - https://github.com/traefik/traefik-helm-chart
maintainers:
  - name: supergate-jhbyun
dependencies:
  - name: traefik
    version: 41.6.0
    repository: https://supergate-hub.github.io/helm-charts
    condition: traefik.enabled

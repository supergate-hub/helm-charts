name: Lint and test charts
on:
  pull_request:
    paths:
      - 'charts/**'
      - 'ct.yaml'
      - '.github/workflows/lint-test.yaml'
permissions:
  contents: read
concurrency:
  group: lint-test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.19.0
      - uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0
      - name: List changed charts
        id: changed
        run: |
          changed=$(ct list-changed --config ct.yaml)
          if [ -n "$changed" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "$changed"
          fi
      - name: Lint changed charts
        if: steps.changed.outputs.changed == 'true'
        run: ct lint --config ct.yaml
      - uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        if: steps.changed.outputs.changed == 'true'
      - name: Pre-apply CRDs that Supergate charts ship as templates
        # Supergate charts render their CRDs as templates (sync-wave -20 for Argo CD) instead of
        # crds/, so that consumers can use skipCrds against subchart CRDs. A plain helm install on
        # an empty cluster needs those CRDs before it can validate the custom resources.
        if: steps.changed.outputs.changed == 'true'
        run: |
          set -eu
          for chart in charts/sst-*/; do
            for crd in "$chart"templates/*-crds.yaml; do
              [ -f "$crd" ] || continue
              helm template pre "$chart" --show-only "templates/$(basename "$crd")" | kubectl apply --server-side -f -
            done
          done
          kubectl wait --for=condition=Established crd --all --timeout=120s
      - name: Install changed charts in kind
        # Vendored upstream charts (charts.lock.json) are lint-only: several need external
        # configuration (GitHub URLs, storage, CRD owners) that a throwaway kind cluster cannot
        # provide. Supergate-owned charts are installed end to end.
        if: steps.changed.outputs.changed == 'true'
        run: |
          excluded=$(python3 -c "import json;print(','.join(c['name'] for c in json.load(open('charts.lock.json'))['charts']))")
          ct install --config ct.yaml --excluded-charts "$excluded"

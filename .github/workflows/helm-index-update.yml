name: Helm index update (extract to main, release tgz, merge index with release URL)

on:
  workflow_dispatch:
    inputs:
      chart_repo_name:
        description: 'Upstream Helm repo name (e.g., harbor, bitnami)'
        required: true
      chart_repo_url:
        description: 'Upstream Helm repo URL (e.g., https://helm.goharbor.io)'
        required: true
      chart_name:
        description: 'Chart name (e.g., harbor)'
        required: true
      chart_version:
        description: 'Chart version (e.g., 1.17.1)'
        required: true

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      # --- MAIN: charts/<name>/ 에 소스 배치 ---
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Pull tgz from upstream
        env:
          REPO_NAME: ${{ github.event.inputs.chart_repo_name }}
          REPO_URL:  ${{ github.event.inputs.chart_repo_url }}
          CHART:     ${{ github.event.inputs.chart_name }}
          VERSION:   ${{ github.event.inputs.chart_version }}
        run: |
          set -euo pipefail
          helm repo add "${REPO_NAME}" "${REPO_URL}"
          helm repo update
          mkdir -p .work
          helm pull "${REPO_NAME}/${CHART}" --version "${VERSION}" --destination .work
          TGZ_FILE=".work/${CHART}-${VERSION}.tgz"
          echo "TGZ_FILE=${TGZ_FILE}" >> "$GITHUB_ENV"
          echo "FILE_BASENAME=$(basename "${TGZ_FILE}")" >> "$GITHUB_ENV"

      - name: Extract tgz into main/charts/<name>
        env:
          CHART:    ${{ github.event.inputs.chart_name }}
          VERSION:  ${{ github.event.inputs.chart_version }}
          TGZ_FILE: ${{ env.TGZ_FILE }}
        run: |
          set -euo pipefail
          rm -rf .work/extracted
          mkdir -p .work/extracted
          tar -xzf "${TGZ_FILE}" -C .work/extracted
          SRC_DIR=".work/extracted/${CHART}"
          [ -d "${SRC_DIR}" ] || { echo "Expected ${SRC_DIR} not found"; exit 1; }

          DEST_DIR="charts/${CHART}"
          mkdir -p "${DEST_DIR}"
          rsync -a --delete "${SRC_DIR}/" "${DEST_DIR}/"

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${DEST_DIR}"
          if ! git diff --staged --quiet; then
            git commit -m "chore(charts): sync ${CHART} ${VERSION} into charts/${CHART}/"
            git push origin main
          else
            echo "No changes in main."
          fi

      # --- RELEASE: tgz를 릴리스 자산으로 업로드(태그 = 파일명 그대로) ---
      - name: Create release & upload tgz (tag = tgz filename)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.FILE_BASENAME }}   # e.g. harbor-1.17.1.tgz
          name:     ${{ env.FILE_BASENAME }}
          draft: false
          prerelease: false
          files: |
            ${{ env.TGZ_FILE }}

      # --- GH-PAGES: index.yaml 병합( url은 릴리스 다운로드 경로 ) ---
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
          fetch-depth: 0

      - name: Merge index.yaml on gh-pages using helm repo index
        env:
          CHART:         ${{ github.event.inputs.chart_name }}
          VERSION:       ${{ github.event.inputs.chart_version }}
          FILE_BASENAME: ${{ env.FILE_BASENAME }}
          TGZ_FILE:      ${{ env.TGZ_FILE }}
        run: |
          set -euo pipefail
          cd gh-pages

          # 릴리스 다운로드 base: .../releases/download/<tag>
          OWNER_REPO="${GITHUB_REPOSITORY}"
          TAG="${FILE_BASENAME}"    # tag = "harbor-1.17.1.tgz"
          RELEASE_BASE="https://github.com/${OWNER_REPO}/releases/download/${TAG}"

          # helm은 작업 디렉터리의 *.tgz만 인덱싱하므로, 임시 폴더로 복사해 index 생성
          rm -rf .tmp-index && mkdir -p .tmp-index
          cp "${GITHUB_WORKSPACE}/${TGZ_FILE}" ".tmp-index/${CHART}-${VERSION}.tgz"

          # 기존 index.yaml이 있으면 --merge로 병합, 없으면 새로 생성
          if [ -f index.yaml ]; then
            cp index.yaml .tmp-index/index.yaml
            (cd .tmp-index && helm repo index . --url "${RELEASE_BASE}" --merge index.yaml)
            mv .tmp-index/index.yaml index.yaml
          else
            (cd .tmp-index && helm repo index . --url "${RELEASE_BASE}")
            mv .tmp-index/index.yaml index.yaml
          fi

          echo "Indexed with URL base = ${RELEASE_BASE}"
          head -n 60 index.yaml || true

      - name: Commit & push gh-pages
        working-directory: gh-pages
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.yaml
          if ! git diff --staged --quiet; then
            git commit -m "ci(index): ${{ github.event.inputs.chart_name }} @ ${{ github.event.inputs.chart_version }} (merge with release URL)"
            git push origin gh-pages
          else
            echo "No changes in gh-pages."
          fi

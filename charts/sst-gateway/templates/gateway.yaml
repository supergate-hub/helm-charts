apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: {{ .Values.gatewayClass.name }}
  labels:
    {{ .Values.gatewayClass.labelKey }}: {{ .Values.gatewayClass.labelValue }}
spec:
  controllerName: {{ .Values.gatewayClass.controllerName }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.gateway.name }}
  namespace: {{ include "sst-gateway.namespace" . }}
spec:
  gatewayClassName: {{ .Values.gatewayClass.name }}
  listeners:
    - name: https
      protocol: HTTPS
      port: {{ .Values.gateway.httpsPort }}
      hostname: {{ .Values.gateway.wildcardHostname | quote }}
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: {{ .Values.gateway.tlsSecretName }}
      allowedRoutes:
        namespaces:
          from: Same
    - name: http
      protocol: HTTP
      port: {{ .Values.gateway.httpPort }}
      hostname: {{ .Values.gateway.hostname | quote }}
      allowedRoutes:
        namespaces:
          from: Same
{{- if .Values.canary.enabled }}
---
# Canary route on HTTPS and an HTTP to HTTPS redirect. Defaults (group, kind, weight, match)
# are spelled out so Argo CD does not report the API server's defaulting as drift.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sst-canary
  namespace: {{ include "sst-gateway.namespace" . }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.gateway.name }}
      sectionName: https
  hostnames: [{{ .Values.gateway.hostname | quote }}]
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: sst-gateway-canary
          port: 8080
          weight: 1
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sst-canary-redirect
  namespace: {{ include "sst-gateway.namespace" . }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.gateway.name }}
      sectionName: http
  hostnames: [{{ .Values.gateway.hostname | quote }}]
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            port: 443
            statusCode: 301
{{- end }}
